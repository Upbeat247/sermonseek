name: Weekly sermon refresh

on:
  schedule:
    # Sundays 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: sermonseek-cache-v1

      - name: Fetch videos
        working-directory: scripts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fetch_videos.py --all --limit 100

      - name: Fetch transcripts
        working-directory: scripts
        run: python fetch_transcripts.py --all

      - name: Tag sermons
        working-directory: scripts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python tag_sermons.py --all

      - name: Build public data
        working-directory: scripts
        run: python build_data.py

      - name: Commit new data
        run: |
          git config user.name "sermonseek-bot"
          git config user.email "bot@sermonseek.app"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: weekly sermon refresh"
            git push
          fi
